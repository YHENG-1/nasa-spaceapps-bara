version: '3.8'

services:
  bara-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: bara-fire-observatory:latest
    container_name: bara-fire-observatory
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NASA_FIRMS_MAP_KEY=${NASA_FIRMS_MAP_KEY:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/data:/app/backend/data:rw
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
